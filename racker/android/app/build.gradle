plugins { id 'com.android.application' }

android {
    namespace 'br.com.racker'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.racker'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { manifestPlaceholders = [cleartextAllowed: 'true'] }
        release { manifestPlaceholders = [cleartextAllowed: 'false'] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.work:work-runtime:2.10.1' }
